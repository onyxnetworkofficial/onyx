[package]
name = "onyx-fuzz-common"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Shared fixtures for the Onyx fuzz targets and the seed corpus generator (no libFuzzer)."

[dependencies]
onyx-core = { path = "../../crates/onyx-core" }
onyx-merkle = { path = "../../crates/onyx-merkle" }
onyx-labels = { path = "../../crates/onyx-labels" }
onyx-api = { path = "../../crates/onyx-api" }
onyx-coordinator = { path = "../../crates/onyx-coordinator" }
onyx-node = { path = "../../crates/onyx-node" }
onyx-recipe-sdk = { path = "../../crates/onyx-recipe-sdk" }
onyx-btc-schema = { path = "../../adapters/btc-schema" }
onyx-pool-schema = { path = "../../adapters/pool-schema" }
onyx-reserve-schema = { path = "../../adapters/reserve-schema" }
onyx-source-fiscaldata = { path = "../../adapters/source-fiscaldata", features = ["round"] }
onyx-source-edgar = { path = "../../adapters/source-edgar" }
onyx-source-page = { path = "../../adapters/source-page" }
borsh = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync", "test-util"] }
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "query"] }
http-body-util = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }

[[bin]]
name = "seedgen"
path = "src/bin/seedgen.rs"
