# gitleaks configuration (ROADMAP L13, LC-25). The default rules plus an allowlist of the
# findings reviewed in docs/audit/2026-10-16-history-secret-scan.md. Every entry needs BOTH the
# exact path and the exact reviewed value or line (condition AND), so a new value in the same file, or the
# same value in another file, is still reported. Never add a broad pattern here.
# Run: gitleaks git --log-opts="--all" --redact .   (reads this file from the repo root)

title = "onyx gitleaks config"

[extend]
useDefault = true

[[allowlists]]
# Safe: the key id (hash of the public key) of the synthetic source-signing test key published in onyx-source-keys.json; no private material.
description = "adapters/source-signed/fixtures/example-report.json key: reviewed 2026-10-15"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^adapters/source\-signed/fixtures/example\-report\.json$''']
regexes = ['''^0x2bc349c7a25b3cb07bd93fe2fb810be835d24a833b6ace75afb6451df9724c1b$''']

[[allowlists]]
# Safe: OnyxRegistry.logKey(fact, attempt, observer, round): a Keccak-256 slot key in a generated test vector (OnyxRegistryTranscriptLog.t.sol reads it back).
description = "fixtures/registry/transcript-log.json logKey: reviewed 2026-10-15"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^fixtures/registry/transcript\-log\.json$''']
regexes = ['''^0x76e4c63c5855ba32d2e08bd1c6f73d014f0ca1954f85520160348b58b69a00e8$''']

[[allowlists]]
# Safe: keccak256(metric name) in the registry vectors; all four recomputed with `cast keccak` and equal.
description = "fixtures/registry/vectors.json key: reviewed 2026-10-15"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^fixtures/registry/vectors\.json$''']
regexes = ['''^0x6c94bf90a5cb142a61a57028881ae0775fb9a15e8f505bbfc2e288e2d5da5af3$''', '''^0x6d6f09c6657513933505c2a03cfc31ef52e26d7847718e8bf4789fa6f0020ba9$''', '''^0xc5d2460186f7233c927e7db2dcc703c0e500b653ca82273b7bfad8045d85a470$''', '''^0xee4e35b5c6b7f06abb6c69bc554849d3df8ca9b99ffc9d5c13ae46a2e801afde$''']

[[allowlists]]
# Safe: keccak256 of the treasury metric name, the same value as its metrics[] entry.
description = "fixtures/registry/vectors.json metricKey: reviewed 2026-10-15"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^fixtures/registry/vectors\.json$''']
regexes = ['''^0xee4e35b5c6b7f06abb6c69bc554849d3df8ca9b99ffc9d5c13ae46a2e801afde$''']

[[allowlists]]
# Safe: the treasury observation's subject key, a hash generated by adapters/source-fiscaldata/tests/registry_vectors.rs.
description = "fixtures/registry/vectors.json subjectKey: reviewed 2026-10-15"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^fixtures/registry/vectors\.json$''']
regexes = ['''^0x881324b0873d1318f53d4bd752fc1c22205db9d8ac3bfd23d1dd419ea343b3d2$''']

[[allowlists]]
# Safe: a comment listing the cast/forge flag forms the scan looks for; the value is the literal text `0x..`, no key material.
description = "scripts/check-secrets.sh: reviewed 2026-10-15"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^scripts/check\-secrets\.sh$''']
regexes = ['''^\s*# cast/forge flags: --private-key 0x\.\., --private-key=0x\.\.$''']

[[allowlists]]
# Safe: SourceKey::id (Keccak of the public signing key) of the anvil rehearsal's level-3 source; no private material.
description = "apps/web/static/level3/signed-rehearsal.json: reviewed 2026-10-24 (public snapshot scan)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^apps/web/static/level3/signed\-rehearsal\.json$''']
regexes = ['''^0xc06205cc836eb3c87b5ed9c74c97cf61a0b59ac2ec2cad75e0c9c1ea8843ce87$''']

[[allowlists]]
# Safe: the reveal key's public coordinates and the Schnorr key-proof challenge (OnyxRegistry.keyProofChallenge) of the sealed-reveal test vector; all public by design (ADR-0027 amendment 10).
description = "fixtures/registry/sealed-reveals.json: reviewed 2026-10-24 (public snapshot scan)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^fixtures/registry/sealed\-reveals\.json$''']
regexes = ['''^0xeae94013532c56acf86f6ba1d6bad190b7789f38831a97c530b28054462c0e5b$''', '''^0x24653eac434488002cc06bbfb7f10fe18991e35f9fe4302dbea6d2353dc0ab1c$''', '''^0x119fc5009a032aa9fe47f5e149bb8442f71f884ccb516590686d8ff6ab91c613$''']

[[allowlists]]
# Safe: the browser storage key name of the practice markets (a fixed label, not a credential).
description = "apps/web/src/lib/arena-state.svelte.ts storage key: reviewed 2026-10-29"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^apps/web/src/lib/arena\-state\.svelte\.ts$''']
regexes = ['''^onyx\-markets\-v2$''']

[[allowlists]]
# Safe: the tONYX test token's public contract address on Base Sepolia (anyone can read it on chain).
description = "apps/web/static/markets/base-sepolia.json token address: reviewed 2026-10-29"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^apps/web/static/markets/base\-sepolia\.json$''']
regexes = ['''^0x1cb5f5816812991ac3b52c63c3fcadcc9f544579$''']
