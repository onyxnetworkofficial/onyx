[package]
name = "btc-chain-stats"
description = "Recipe: per-block Bitcoin chain statistics (transactions, fees, fee rates, size, supply, SegWit and Taproot use, active scripts, coin-blocks destroyed) from blocks alone (ADR-0043)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
onyx-recipe-sdk = { workspace = true, features = ["rt"] }
onyx-chain-schema.workspace = true
borsh = { version = "1", default-features = false, features = ["derive"] }
sha2 = { version = "0.10", default-features = false }

[lints]
workspace = true
