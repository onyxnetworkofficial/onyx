name: desktop
# CL10 (ADR-0061): the Onyx desktop app's installers and the single-file onyx-contrib programs,
# built on each system and attached to the test-network release whose tag was pushed. Test network
# only. The installers are unsigned (code signing is a later owner decision; docs/desktop-app.md
# tells users how to open them). Stable asset names, so the website's Download page needs only its
# RELEASE constant changed (apps/web/src/lib/release.ts):
#   onyx-desktop-windows-x64-setup.exe  onyx-desktop-windows-x64.msi   onyx-desktop-macos-universal.dmg
#   onyx-desktop-linux-x86_64.AppImage  onyx-desktop-linux-amd64.deb
#   onyx-contrib-linux-x64  onyx-contrib-macos-arm64  onyx-contrib-macos-x64  onyx-contrib-windows-x64.exe
#   SHA256SUMS (merged with the release's own SHA256SUMS from scripts/release-build.sh, if any)
# No secret other than this repository's own GITHUB_TOKEN; every action pinned to a full commit SHA.
on:
  push:
    tags: ['v*-testnet']
  # A manual run builds everything as workflow artifacts and attaches nothing.
  workflow_dispatch:

permissions: {}

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # linuxdeploy's strip fails on newer ELF sections; the release profile strips the app already.
  NO_STRIP: 'true'

jobs:
  build:
    name: build (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: linux
            os: ubuntu-22.04
          - system: macos
            # GitHub retires the macos-14 image on 2026-11-02 (its brownouts cancel jobs before that).
            os: macos-15
          - system: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - name: Linux libraries for the web view (Tauri 2 prerequisites)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ "$RUNNER_OS" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      - name: onyx-contrib tests (the app server, the bundle, keys never leave)
        run: node --test apps/contrib/test/*.test.mjs
      - name: Single-file onyx-contrib programs (scripts/desktop-build.sh; this system's one smoke-tested)
        run: |
          case "$RUNNER_OS" in
            Linux) scripts/desktop-build.sh sea linux-x64 ;;
            macOS) scripts/desktop-build.sh sea macos-arm64 macos-x64 macos-universal ;;
            Windows) scripts/desktop-build.sh sea windows-x64 ;;
          esac
      - name: The sidecar for Tauri (externalBin binaries/onyx-contrib-<target>)
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          case "$RUNNER_OS" in
            Linux) cp sea/onyx-contrib-linux-x64 apps/desktop/src-tauri/binaries/onyx-contrib-x86_64-unknown-linux-gnu ;;
            macOS) # A universal build compiles each architecture and looks for its own sidecar.
              cp sea/onyx-contrib-macos-arm64 apps/desktop/src-tauri/binaries/onyx-contrib-aarch64-apple-darwin
              cp sea/onyx-contrib-macos-x64 apps/desktop/src-tauri/binaries/onyx-contrib-x86_64-apple-darwin
              cp sea/onyx-contrib-macos-universal apps/desktop/src-tauri/binaries/onyx-contrib-universal-apple-darwin ;;
            Windows) cp sea/onyx-contrib-windows-x64.exe apps/desktop/src-tauri/binaries/onyx-contrib-x86_64-pc-windows-msvc.exe ;;
          esac
      - name: Tauri command line (pinned in apps/desktop/package-lock.json)
        run: npm ci --prefix apps/desktop --no-audit --no-fund
      - name: The shell's own tests
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Installers
        working-directory: apps/desktop
        run: |
          case "$RUNNER_OS" in
            Linux) npm run tauri -- build --ci --bundles deb,appimage ;;
            macOS) npm run tauri -- build --ci --target universal-apple-darwin --bundles dmg ;;
            Windows) npm run tauri -- build --ci --bundles nsis,msi ;;
          esac
      - name: Stable file names
        run: |
          set -euo pipefail
          mkdir out
          one() { # glob, new name: exactly one file must match
            local m=( $1 )
            [ ${#m[@]} -eq 1 ] && [ -f "${m[0]}" ] || { echo "expected one file for $1, found: ${m[*]}" >&2; exit 1; }
            cp "${m[0]}" "out/$2"
          }
          b=apps/desktop/src-tauri/target/release/bundle
          case "$RUNNER_OS" in
            Linux)
              one "$b/deb/*.deb" onyx-desktop-linux-amd64.deb
              one "$b/appimage/*.AppImage" onyx-desktop-linux-x86_64.AppImage
              cp sea/onyx-contrib-linux-x64 out/ ;;
            macOS)
              one "apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg" onyx-desktop-macos-universal.dmg
              cp sea/onyx-contrib-macos-arm64 sea/onyx-contrib-macos-x64 out/ ;;
            Windows)
              one "$b/nsis/*-setup.exe" onyx-desktop-windows-x64-setup.exe
              one "$b/msi/*.msi" onyx-desktop-windows-x64.msi
              cp sea/onyx-contrib-windows-x64.exe out/ ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.system }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-testnet')
    runs-on: ubuntu-22.04
    # The only job that may write: it attaches the files to this tag's release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          pattern: desktop-*
          merge-multiple: true
      - name: SHA256SUMS and attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd out
          want="onyx-desktop-windows-x64-setup.exe onyx-desktop-windows-x64.msi onyx-desktop-macos-universal.dmg onyx-desktop-linux-x86_64.AppImage onyx-desktop-linux-amd64.deb onyx-contrib-linux-x64 onyx-contrib-macos-arm64 onyx-contrib-macos-x64 onyx-contrib-windows-x64.exe"
          for f in $want; do [ -s "$f" ] || { echo "missing $f" >&2; exit 1; }; done
          [ "$(ls | wc -l)" -eq 9 ] || { echo "unexpected files: $(ls)" >&2; exit 1; }
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release download "$TAG" -R "$REPO" -p SHA256SUMS -D ../old 2>/dev/null || true
          else
            gh release create "$TAG" -R "$REPO" --prerelease --title "$TAG" --notes "Test network only (Base Sepolia, no real money). The Onyx desktop app for Windows, macOS and Linux, and onyx-contrib as single-file programs. The installers are not code-signed yet: Windows and macOS ask once before opening them (docs/desktop-app.md). Check files against SHA256SUMS."
          fi
          sha256sum -- $want >../new.sums
          { [ -f ../old/SHA256SUMS ] && awk -v w=" $want " 'index(w, " " $2 " ") == 0' ../old/SHA256SUMS; cat ../new.sums; } | sort -k2 >SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" -R "$REPO" --clobber -- $want SHA256SUMS
