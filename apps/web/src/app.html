<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Onyx Network</title>
		<!-- The Onyx mark (the header glyph on the site's background tile): SVG for current
		     browsers, ICO (16, 32, 48 px) for the rest and for /favicon.ico requests, PNG for phones. -->
		<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
		<meta name="description" content="Share useful data with Onyx. Add your own dataset, suggest a public source, or share a forecast. Start with a description; every submission needs review." />
		<meta name="theme-color" content="#080909" />
		<!-- Share previews. og:image needs an absolute URL once the domain is chosen (TRACKER). -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Onyx Network" />
		<meta property="og:description" content="Have useful data? Add it to Onyx. Start with a description and find out how it can be checked. Early preview." />
		<meta property="og:image" content="og.jpg" />
		<meta name="twitter:card" content="summary_large_image" />
		<!-- Fonts ship with the site (OFL, latin subset; licenses in fonts/). The three faces
		     above the fold are preloaded so the first paint uses them. -->
		<link rel="preload" href="./fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="./fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="./fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
		<!-- W9 follow-up: How it works, Data, Labels, Explorer and API read data/demo.json as soon as their
		     code runs (src/lib/data.ts); asking here starts it beside the scripts, not after them.
		     Named pages only: Run, Reserves and the not-found page never read it. -->
		<script>/^#\/(how-it-works|data|labels|explorer|api)\b/.test(location.hash)&&document.head.appendChild(Object.assign(document.createElement('link'),{rel:'preload',as:'fetch',href:'./data/demo.json',crossOrigin:'anonymous'}))</script>
		<style>@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:swap;src:url(./fonts/instrument-serif-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400;font-display:swap;src:url(./fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:500;font-display:swap;src:url(./fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:600;font-display:swap;src:url(./fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(./fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(./fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
