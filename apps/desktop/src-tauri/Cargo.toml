[package]
name = "onyx-desktop"
version = "0.3.0"
description = "Onyx desktop app (test network): a window around onyx-contrib's local app (CL10, ADR-0061)"
edition = "2021"
license = "Apache-2.0"
publish = false

# Its own workspace: the repository's workspace (and so check-all) never builds this crate, which
# needs the system web view libraries. Built by .github/workflows/desktop.yml.
[workspace]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
