<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Onyx mark (the header's glyph): a dark diamond with a cream edge, on the site's
       background tile so it shows on light and dark browser tabs. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3833"/>
      <stop offset="0.6" stop-color="#050505"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#080909"/>
  <rect x="17" y="17" width="30" height="30" rx="4" transform="rotate(45 32 32)" fill="url(#g)" stroke="#ebe5d6" stroke-width="3.2"/>
</svg>
