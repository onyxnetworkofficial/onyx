[package]
name = "onyx-check"
description = "Command-line check of an Onyx API answer for agents and scripts (NS8, ADR-0047): the network's own client check, with the root read on the caller's own chain node."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "onyx-check"
path = "src/main.rs"

[dependencies]
onyx-core.workspace = true
onyx-api = { path = "../onyx-api", features = ["http-client"] }
hex.workspace = true
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }

[lints]
workspace = true
