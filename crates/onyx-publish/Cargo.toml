[package]
name = "onyx-publish"
description = "Publisher tool for large datasets (contributor loop CL5, ADR-0059): CSV or JSON Lines in, checked shards and a manifest out, signed with a test key, anchored in OnyxSignedBook, uploaded to a node. Test network only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "onyx_publish"
path = "src/lib.rs"

[[bin]]
name = "onyx-publish"
path = "src/main.rs"

# The reviewer's tool for publisher applications (ADR-0066 item 8).
[[bin]]
name = "book-reviewer"
path = "src/bin/book-reviewer.rs"

[dependencies]
onyx-core.workspace = true
onyx-bulk.workspace = true
onyx-fetch.workspace = true
onyx-api = { path = "../onyx-api", features = ["http-client"] }
borsh.workspace = true
hex.workspace = true
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "macros"] }
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
http-body-util = "0.1"

[dev-dependencies]
# The guarded fetch against a local fixture server (verify-application).
onyx-fetch = { workspace = true, features = ["fixture"] }
# The successor links end-to-end test serves an in-process node over HTTP.
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "query"] }

[lints]
workspace = true
