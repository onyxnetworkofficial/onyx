# onyx-node-btc instead of onyx-node (review RESAPI-R1 F4): the same hardened
# unit, with btc.entity-reserve's serving check (ADR-0034 Amendment 1).
#
#   sudo install -m 0755 target/release/onyx-node-btc /usr/local/bin/onyx-node-btc
#   sudo install -D -m 0644 deploy/systemd/onyx-node.service.d/btc.conf \
#     /etc/systemd/system/onyx-node.service.d/btc.conf
#   sudo systemctl daemon-reload && sudo systemctl restart onyx-node
#
# ONYX_RESERVE_GATE names the committed scan, label set and cross-checks of a
# checkout at /opt/onyx (as Documentation= in the unit); each is checked
# against fixtures/SHA256SUMS at start. Point it at your own config (in
# node.env) to change the served chain's start or add second scans. The label
# set is a test.* set: node.env needs ONYX_ALLOW_TEST_LABELS=1 to serve it.

[Service]
ExecStartPre=
ExecStartPre=/usr/local/bin/onyx-node-btc --check-config
ExecStart=
ExecStart=/usr/local/bin/onyx-node-btc
Environment=ONYX_RESERVE_GATE=/opt/onyx/deploy/reserve-gate.json
